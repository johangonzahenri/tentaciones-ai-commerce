<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
  
  <!-- Perspective Floor Grid -->
  <g stroke="rgba(56,189,248,0.15)" stroke-width="1.5">
    <line x1="150" y1="280" x2="450" y2="280" />
    <line x1="200" y1="240" x2="400" y2="240" />
    <line x1="240" y1="200" x2="360" y2="200" />
  </g>

  <!-- Anchored Sneaker Model on Floor -->
  <ellipse cx="300" cy="245" rx="50" ry="16" fill="rgba(0,0,0,0.4)" />
  <g transform="translate(300, 225)" stroke="#38bdf8" stroke-width="2" fill="rgba(56,189,248,0.3)">
    <polygon points="-50,15 -10,-25 35,-20 60,10 40,20 -20,20" />
    <polygon points="-10,-25 15,-45 45,-30 35,-20" fill="rgba(236,72,153,0.4)" stroke="#ec4899" />
    <line x1="-50" y1="15" x2="40" y2="20" stroke="#f43f5e" stroke-width="2" />
  </g>

  <!-- Coordinate Axes (XYZ) -->
  <g transform="translate(300, 245)" stroke-width="2">
    <line x1="0" y1="0" x2="40" y2="10" stroke="#ef4444" />
    <text x="44" y="14" fill="#ef4444" font-family="monospace" font-size="10">X</text>
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#10b981" />
    <text x="-4" y="-55" fill="#10b981" font-family="monospace" font-size="10">Y</text>
    <line x1="0" y1="0" x2="-35" y2="15" stroke="#3b82f6" />
    <text x="-48" y="20" fill="#3b82f6" font-family="monospace" font-size="10">Z</text>
  </g>

  <!-- Badge -->
  <rect x="30" y="25" width="160" height="26" rx="13" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" />
  <text x="45" y="42" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700">PASO 4: 6-DoF PLACEMENT</text>
  <text x="30" y="305" fill="#94a3b8" font-family="sans-serif" font-size="13">✦ Fijación en coordenadas del mundo real con rotación y escala 1:1</text>
</svg>
