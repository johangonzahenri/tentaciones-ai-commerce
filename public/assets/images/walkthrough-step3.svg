<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
  
  <!-- Perspective Floor Grid -->
  <g stroke="rgba(56,189,248,0.2)" stroke-width="1.5">
    <line x1="150" y1="280" x2="450" y2="280" />
    <line x1="200" y1="240" x2="400" y2="240" />
    <line x1="240" y1="200" x2="360" y2="200" />
    <line x1="300" y1="120" x2="100" y2="310" stroke-dasharray="4 4" />
    <line x1="300" y1="120" x2="200" y2="310" stroke-dasharray="4 4" />
    <line x1="300" y1="120" x2="400" y2="310" stroke-dasharray="4 4" />
    <line x1="300" y1="120" x2="500" y2="310" stroke-dasharray="4 4" />
  </g>

  <!-- Raycast Line from Camera to Floor -->
  <circle cx="300" cy="110" r="8" fill="#f43f5e" />
  <line x1="300" y1="110" x2="300" y2="240" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3" />

  <!-- Reticle Ring -->
  <ellipse cx="300" cy="240" rx="55" ry="20" fill="rgba(56,189,248,0.25)" stroke="#38bdf8" stroke-width="2" />
  <circle cx="300" cy="240" r="5" fill="#38bdf8" />
  <text x="315" y="235" fill="#38bdf8" font-family="monospace" font-size="11">Hit-Test Reticle (Tracking)</text>

  <!-- Badge -->
  <rect x="30" y="25" width="160" height="26" rx="13" fill="rgba(244,63,94,0.2)" stroke="#f43f5e" />
  <text x="45" y="42" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="700">PASO 3: SCANNING &amp; HIT-TEST</text>
  <text x="30" y="305" fill="#94a3b8" font-family="sans-serif" font-size="13">✦ Proyección de rayos contra el plano del piso con XRHitTestSource</text>
</svg>
