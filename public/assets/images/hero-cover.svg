<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#heroBg)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Glowing Spatial Orbit Ring -->
  <ellipse cx="560" cy="225" rx="160" ry="80" fill="none" stroke="url(#accentGlow)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" transform="rotate(-15 560 225)" />
  <circle cx="560" cy="225" r="70" fill="rgba(236,72,153,0.12)" stroke="rgba(236,72,153,0.3)" stroke-width="1.5" />

  <!-- 3D Polyhedral Sneaker Wireframe Representation -->
  <g transform="translate(560, 225) scale(1.1)" stroke="#38bdf8" stroke-width="1.8" fill="rgba(56,189,248,0.15)">
    <polygon points="-45,15 -10,-25 35,-20 60,10 40,25 -25,25" />
    <polygon points="-10,-25 15,-45 45,-30 35,-20" />
    <line x1="-45" y1="15" x2="40" y2="25" stroke="#f43f5e" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle cx="35" cy="-20" r="4" fill="#ec4899" />
    <circle cx="-10" cy="-25" r="4" fill="#f59e0b" />
  </g>

  <!-- Left Content Branding -->
  <rect x="50" y="70" width="380" height="310" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Badge -->
  <rect x="75" y="95" width="165" height="28" rx="14" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="85" y="114" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">WEBXR SPATIAL AR</text>

  <!-- Brand Title -->
  <text x="75" y="165" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="900">Tentaciones</text>
  <text x="75" y="198" fill="url(#accentGlow)" font-family="system-ui, sans-serif" font-size="22" font-weight="700">AI-Powered Commerce</text>

  <!-- Value propositions -->
  <text x="75" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✦ Real GLB / glTF 2.0 3D spatial models</text>
  <text x="75" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✦ Hit-Test plane tracking &amp; floor anchoring</text>
  <text x="75" y="290" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✦ Biometric sizing &amp; instant bag checkout</text>

  <!-- CTA pill -->
  <rect x="75" y="320" width="150" height="38" rx="8" fill="#ec4899" />
  <text x="98" y="344" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Explorar Tienda</text>

  <rect x="235" y="320" width="130" height="38" rx="8" fill="transparent" stroke="#38bdf8" stroke-width="1.5" />
  <text x="252" y="344" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Ver Caso Web</text>
</svg>
